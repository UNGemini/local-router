[package]
name = "pipeline-rs"
version = "0.1.0"
edition = "2021"
description = "GTFS + OSM -> .wheelsrouter converter (Rust rewrite of pipeline/build.py)"

[[bin]]
name = "pipeline"
path = "src/main.rs"

[dependencies]
# CSV parsing
csv = "1.3"
# ZIP reading
zip = "2"
# OSM PBF parsing
osmpbf = "0.3"
# Cap'n Proto writing
capnp = "0.20"
# Anyhow for ergonomic error handling
anyhow = "1"
# CLI arg parsing
clap = { version = "4", features = ["derive"] }
# Progress output
indicatif = "0.17"
# OSM XML parsing
quick-xml = "0.37"

[build-dependencies]
capnpc = "0.20"
