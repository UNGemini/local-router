<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Wheels Router Nano</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Outfit:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <style>
            :root {
                --bg: #0c0e12;
                --surface: #14171d;
                --surface2: #1c2028;
                --border: #2a2e38;
                --text: #e8eaf0;
                --text2: #8b90a0;
                --accent: #47d4a0;
                --accent2: #2fb382;
                --walk: #f0a850;
                --transit: #47d4a0;
                --error: #e85454;
                --radius: 10px;
                --mono: "DM Mono", monospace;
                --sans: "Outfit", sans-serif;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                overflow: hidden;
            }
            body {
                font-family: var(--sans);
                background: var(--bg);
                color: var(--text);
                display: flex;
                flex-direction: column;
            }

            /* header */
            .header {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 20px;
                background: var(--surface);
                border-bottom: 1px solid var(--border);
                z-index: 1000;
                flex-shrink: 0;
            }
            .header h1 {
                font-size: 16px;
                font-weight: 600;
                letter-spacing: -0.02em;
            }
            .header h1 span {
                color: var(--accent);
            }
            .header .stats {
                font-family: var(--mono);
                font-size: 11px;
                color: var(--text2);
                margin-left: auto;
            }
            .header .status {
                font-family: var(--mono);
                font-size: 11px;
                padding: 3px 8px;
                border-radius: 4px;
                background: var(--surface2);
                border: 1px solid var(--border);
            }
            .header .status.ready {
                color: var(--accent);
                border-color: var(--accent2);
            }
            .header .status.loading {
                color: var(--walk);
            }
            .header .status.error {
                color: var(--error);
            }

            /* main layout */
            .main {
                display: flex;
                flex: 1;
                min-height: 0;
            }

            /* sidebar */
            .sidebar {
                width: 380px;
                min-width: 380px;
                background: var(--surface);
                border-right: 1px solid var(--border);
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .sidebar-header {
                padding: 16px 20px 12px;
                border-bottom: 1px solid var(--border);
            }
            .sidebar-header h2 {
                font-size: 13px;
                font-weight: 500;
                color: var(--text2);
                text-transform: uppercase;
                letter-spacing: 0.08em;
                margin-bottom: 12px;
            }

            /* input fields */
            .field {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 8px;
            }
            .field-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                flex-shrink: 0;
            }
            .field-dot.origin {
                background: var(--accent);
            }
            .field-dot.dest {
                background: var(--error);
            }
            .field input {
                flex: 1;
                background: var(--surface2);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 8px 10px;
                font-family: var(--mono);
                font-size: 12px;
                color: var(--text);
                outline: none;
                transition: border-color 0.15s;
            }
            .field input:focus {
                border-color: var(--accent);
            }
            .field input::placeholder {
                color: var(--text2);
            }

            /* options row */
            .options-row {
                display: flex;
                gap: 8px;
                margin-top: 4px;
            }
            .opt-group {
                display: flex;
                flex-direction: column;
                gap: 3px;
                flex: 1;
            }
            .opt-group label {
                font-size: 10px;
                font-weight: 500;
                color: var(--text2);
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }
            .opt-group input,
            .opt-group select {
                background: var(--surface2);
                border: 1px solid var(--border);
                border-radius: 5px;
                padding: 5px 8px;
                font-family: var(--mono);
                font-size: 11px;
                color: var(--text);
                outline: none;
            }
            .opt-group select {
                cursor: pointer;
            }

            /* plan button */
            .plan-btn {
                display: block;
                width: 100%;
                margin-top: 10px;
                padding: 10px;
                background: var(--accent);
                color: var(--bg);
                border: none;
                border-radius: 6px;
                font-family: var(--sans);
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.02em;
                cursor: pointer;
                transition:
                    background 0.15s,
                    transform 0.1s;
            }
            .plan-btn:hover {
                background: var(--accent2);
            }
            .plan-btn:active {
                transform: scale(0.98);
            }
            .plan-btn:disabled {
                background: var(--surface2);
                color: var(--text2);
                cursor: not-allowed;
            }

            .hint {
                font-size: 11px;
                color: var(--text2);
                margin-top: 8px;
                line-height: 1.5;
                font-family: var(--mono);
            }

            /* results */
            .results {
                flex: 1;
                overflow-y: auto;
                padding: 12px 16px;
            }
            .results::-webkit-scrollbar {
                width: 5px;
            }
            .results::-webkit-scrollbar-track {
                background: transparent;
            }
            .results::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 3px;
            }

            .result-meta {
                font-family: var(--mono);
                font-size: 11px;
                color: var(--text2);
                margin-bottom: 10px;
                padding-bottom: 8px;
                border-bottom: 1px solid var(--border);
            }

            /* plan card */
            .plan-card {
                background: var(--surface2);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                margin-bottom: 10px;
                overflow: hidden;
                cursor: pointer;
                transition: border-color 0.15s;
            }
            .plan-card:hover,
            .plan-card.active {
                border-color: var(--accent);
            }
            .plan-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 14px;
                border-bottom: 1px solid var(--border);
            }
            .plan-head .duration {
                font-size: 18px;
                font-weight: 600;
                letter-spacing: -0.02em;
            }
            .plan-head .time {
                font-family: var(--mono);
                font-size: 11px;
                color: var(--text2);
            }
            .plan-legs {
                display: flex;
                align-items: center;
                gap: 0;
                padding: 10px 14px;
                flex-wrap: wrap;
            }
            .leg-pill {
                display: flex;
                align-items: center;
                gap: 4px;
                padding: 3px 8px;
                border-radius: 4px;
                font-size: 11px;
                font-weight: 500;
                white-space: nowrap;
            }
            .leg-pill.walk {
                background: rgba(240, 168, 80, 0.15);
                color: var(--walk);
            }
            .leg-pill.transit {
                color: #fff;
            }
            .leg-arrow {
                color: var(--text2);
                font-size: 10px;
                margin: 0 2px;
            }

            /* expanded plan detail */
            .plan-detail {
                padding: 0 14px 12px;
                display: none;
            }
            .plan-card.active .plan-detail {
                display: block;
            }
            .leg-detail {
                padding: 8px 0;
                border-top: 1px solid var(--border);
            }
            .leg-detail:first-child {
                border-top: none;
            }
            .leg-detail .leg-type {
                font-size: 10px;
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                margin-bottom: 4px;
            }
            .leg-detail .leg-type.walk-type {
                color: var(--walk);
            }
            .leg-detail .leg-type.transit-type {
                color: var(--transit);
            }
            .leg-detail .leg-info {
                font-family: var(--mono);
                font-size: 11px;
                color: var(--text2);
                line-height: 1.6;
            }
            .leg-detail .stop-list {
                margin-top: 4px;
                padding-left: 14px;
                font-family: var(--mono);
                font-size: 10px;
                color: var(--text2);
                line-height: 1.7;
            }
            .leg-detail .stop-list .stop-name {
                color: var(--text);
            }

            /* map */
            .map-wrap {
                flex: 1;
                position: relative;
            }
            #map {
                width: 100%;
                height: 100%;
            }

            /* map crosshair cursor */
            .leaflet-container {
                cursor: crosshair !important;
            }
            .leaflet-container.leaflet-grab {
                cursor: crosshair !important;
            }
            .leaflet-container.leaflet-dragging {
                cursor: grabbing !important;
            }

            /* loading overlay */
            .loading-overlay {
                position: absolute;
                inset: 0;
                background: rgba(12, 14, 18, 0.85);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 999;
                gap: 16px;
            }
            .loading-overlay.hidden {
                display: none;
            }
            .spinner {
                width: 36px;
                height: 36px;
                border: 3px solid var(--border);
                border-top-color: var(--accent);
                border-radius: 50%;
                animation: spin 0.7s linear infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .loading-text {
                font-family: var(--mono);
                font-size: 12px;
                color: var(--text2);
            }

            /* custom leaflet markers */
            .custom-marker {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                border: 2px solid #fff;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            }
            .marker-origin {
                background: var(--accent);
            }
            .marker-dest {
                background: var(--error);
            }

            /* no plans */
            .no-plans {
                text-align: center;
                padding: 40px 20px;
                color: var(--text2);
                font-size: 13px;
            }

            /* responsive */
            @media (max-width: 800px) {
                .main {
                    flex-direction: column-reverse;
                }
                .sidebar {
                    width: 100%;
                    min-width: auto;
                    max-height: 50vh;
                    border-right: none;
                    border-top: 1px solid var(--border);
                }
                .map-wrap {
                    flex: 1;
                }
            }
        </style>
    </head>
    <body>
        <div class="header">
            <h1>wheels router <span>nano</span></h1>
            <div class="stats" id="stats"></div>
            <div class="status loading" id="status">loading...</div>
        </div>

        <div class="main">
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>trip planner</h2>
                    <div class="field">
                        <div class="field-dot origin"></div>
                        <input
                            type="text"
                            id="origin"
                            placeholder="click map or enter lat,lon"
                            readonly
                        />
                    </div>
                    <div class="field">
                        <div class="field-dot dest"></div>
                        <input
                            type="text"
                            id="dest"
                            placeholder="click map or enter lat,lon"
                            readonly
                        />
                    </div>
                    <div class="options-row">
                        <div class="opt-group">
                            <label>date</label>
                            <input type="date" id="date" value="" />
                        </div>
                        <div class="opt-group">
                            <label>time</label>
                            <input type="time" id="time" value="08:00" />
                        </div>
                        <div class="opt-group">
                            <label>walk speed</label>
                            <select id="walkspeed">
                                <option value="slow">slow</option>
                                <option value="normal" selected>normal</option>
                                <option value="fast">fast</option>
                            </select>
                        </div>
                    </div>
                    <button class="plan-btn" id="planBtn" disabled>
                        plan trip
                    </button>
                    <div class="hint" id="hint">
                        click the map to set origin (green) then destination
                        (red)
                    </div>
                </div>
                <div class="results" id="results"></div>
            </div>
            <div class="map-wrap">
                <div id="map"></div>
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                    <div class="loading-text" id="loadingText">
                        initializing wasm engine...
                    </div>
                </div>
            </div>
        </div>

        <script type="module">
            import init, { WasmRouter } from "./pkg/wheels_router_nano.js";

            let router = null;
            let originMarker = null;
            let destMarker = null;
            let originLatLon = null;
            let destLatLon = null;
            let clickState = "origin"; // 'origin' or 'dest'
            let routeLines = [];
            let activePlanIdx = -1;
            let plans = [];

            // set default date to today
            const dateInput = document.getElementById("date");
            const now = new Date();
            dateInput.value = now.toISOString().slice(0, 10);
            document.getElementById("time").value = now
                .toTimeString()
                .slice(0, 5);

            // init map centered on san francisco
            const map = L.map("map", {
                zoomControl: false,
                attributionControl: false,
            }).setView([37.77, -122.42], 13);

            L.control.zoom({ position: "topright" }).addTo(map);
            L.control
                .attribution({ position: "bottomright", prefix: false })
                .addAttribution(
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
                )
                .addTo(map);

            // dark tile layer
            L.tileLayer(
                "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
                {
                    maxZoom: 19,
                },
            ).addTo(map);

            function makeIcon(cls) {
                return L.divIcon({
                    className: "",
                    html: `<div class="custom-marker ${cls}"></div>`,
                    iconSize: [14, 14],
                    iconAnchor: [7, 7],
                });
            }

            map.on("click", (e) => {
                if (!router) return;
                const { lat, lng } = e.latlng;
                const coordStr = `${lat.toFixed(6)},${lng.toFixed(6)}`;

                if (clickState === "origin") {
                    originLatLon = [lat, lng];
                    document.getElementById("origin").value = coordStr;
                    if (originMarker) map.removeLayer(originMarker);
                    originMarker = L.marker([lat, lng], {
                        icon: makeIcon("marker-origin"),
                    }).addTo(map);
                    clickState = "dest";
                    document.getElementById("hint").textContent =
                        "now click to set destination (red dot)";
                } else {
                    destLatLon = [lat, lng];
                    document.getElementById("dest").value = coordStr;
                    if (destMarker) map.removeLayer(destMarker);
                    destMarker = L.marker([lat, lng], {
                        icon: makeIcon("marker-dest"),
                    }).addTo(map);
                    clickState = "origin";
                    document.getElementById("hint").textContent =
                        "click plan trip, or click map to change origin";
                    document.getElementById("planBtn").disabled = false;
                }
            });

            document
                .getElementById("planBtn")
                .addEventListener("click", doPlan);

            function doPlan() {
                if (!router || !originLatLon || !destLatLon) return;
                clearRoutes();
                activePlanIdx = -1;

                const dateVal = document.getElementById("date").value;
                const timeVal = document.getElementById("time").value;
                const ws = document.getElementById("walkspeed").value;

                const departAt = `${dateVal}T${timeVal}:00Z`;
                const request = {
                    origin: `${originLatLon[0]},${originLatLon[1]}`,
                    destination: `${destLatLon[0]},${destLatLon[1]}`,
                    depart_at: departAt,
                    walking_speed: ws,
                    max_results: 5,
                };

                const t0 = performance.now();
                let result;
                try {
                    const json = router.plan(JSON.stringify(request));
                    result = JSON.parse(json);
                } catch (e) {
                    document.getElementById("results").innerHTML =
                        `<div class="no-plans">error: ${e.message}</div>`;
                    return;
                }
                const elapsed = (performance.now() - t0).toFixed(1);

                plans = result.plans || [];
                renderResults(plans, elapsed);
                if (plans.length > 0) selectPlan(0);
            }

            function renderResults(plans, elapsed) {
                const el = document.getElementById("results");
                if (plans.length === 0) {
                    el.innerHTML = `<div class="no-plans">no routes found. try different locations or a different date/time.</div>`;
                    return;
                }

                let html = `<div class="result-meta">${plans.length} plan${plans.length > 1 ? "s" : ""} found in ${elapsed}ms</div>`;
                plans.forEach((p, idx) => {
                    const mins = Math.round(p.duration_seconds / 60);
                    html += `<div class="plan-card" data-idx="${idx}" onclick="window.__selectPlan(${idx})">`;
                    html += `<div class="plan-head">
      <span class="duration">${mins} min</span>
      <span class="time">${formatTime(p.start_time)}</span>
    </div>`;
                    html += `<div class="plan-legs">`;
                    p.legs.forEach((leg, li) => {
                        if (li > 0)
                            html += `<span class="leg-arrow">&rarr;</span>`;
                        if (leg.type === "walk") {
                            const m =
                                leg.distance_meters ||
                                Math.round(leg.duration_seconds * 1.2);
                            html += `<span class="leg-pill walk">${m}m walk</span>`;
                        } else if (leg.type === "transit") {
                            const ro = leg.route_options[0];
                            const bg = ro.color ? `#${ro.color}` : "#47d4a0";
                            const tc = ro.text_color
                                ? `#${ro.text_color}`
                                : "#000";
                            html += `<span class="leg-pill transit" style="background:${bg};color:${tc}">${ro.route_name}</span>`;
                        }
                    });
                    html += `</div>`;
                    // detail section
                    html += `<div class="plan-detail">`;
                    p.legs.forEach((leg) => {
                        if (leg.type === "walk") {
                            const wt = leg.walk_type || "walk";
                            const m =
                                leg.distance_meters ||
                                Math.round(leg.duration_seconds * 1.2);
                            const s = Math.round(leg.duration_seconds / 60);
                            const fromName =
                                leg.from?.address || leg.from?.stop_id || "";
                            const toName =
                                leg.to?.address || leg.to?.stop_id || "";
                            html += `<div class="leg-detail">
          <div class="leg-type walk-type">${wt}</div>
          <div class="leg-info">${fromName} &rarr; ${toName}<br>${m}m, ~${s} min</div>
        </div>`;
                        } else if (leg.type === "transit") {
                            const ro = leg.route_options[0];
                            const s = Math.round(ro.duration_seconds / 60);
                            html += `<div class="leg-detail">
          <div class="leg-type transit-type">${ro.mode} &middot; ${ro.route_name}${ro.headsign ? " &rarr; " + ro.headsign : ""}</div>
          <div class="leg-info">${ro.from.stop_name || ""} &rarr; ${ro.to.stop_name || ""}, ${s} min${ro.start_time ? " @ " + formatTime(ro.start_time) : ""}</div>
          <div class="stop-list">`;
                            (ro.stops || []).forEach((st) => {
                                html += `<div><span class="stop-name">${st.stop_name || st.stop_id || ""}</span></div>`;
                            });
                            html += `</div></div>`;
                        }
                    });
                    html += `</div></div>`;
                });
                el.innerHTML = html;
            }

            window.__selectPlan = function (idx) {
                selectPlan(idx);
            };

            function selectPlan(idx) {
                // toggle active card
                document.querySelectorAll(".plan-card").forEach((c, i) => {
                    c.classList.toggle("active", i === idx);
                });
                activePlanIdx = idx;
                clearRoutes();
                drawPlanOnMap(plans[idx]);
            }

            function clearRoutes() {
                routeLines.forEach((l) => map.removeLayer(l));
                routeLines = [];
            }

            function drawPlanOnMap(plan) {
                if (!plan) return;
                const allCoords = [];
                plan.legs.forEach((leg) => {
                    if (leg.type === "walk") {
                        const coords = [];
                        if (leg.path && leg.path.length >= 2) {
                            // use real walk path from osm graph
                            leg.path.forEach((p) =>
                                coords.push([p.lat, p.lon]),
                            );
                        } else {
                            // fallback to straight line
                            const from = leg.from?.location;
                            const to = leg.to?.location;
                            if (from && to) {
                                coords.push(
                                    [from.lat, from.lon],
                                    [to.lat, to.lon],
                                );
                            }
                        }
                        if (coords.length >= 2) {
                            const line = L.polyline(coords, {
                                color: "#f0a850",
                                weight: 3,
                                dashArray: "6,6",
                                opacity: 0.8,
                            }).addTo(map);
                            routeLines.push(line);
                            allCoords.push(...coords);
                        }
                    } else if (leg.type === "transit") {
                        const ro = leg.route_options[0];
                        const color = ro.color ? `#${ro.color}` : "#47d4a0";
                        const coords = (ro.stops || [])
                            .filter((s) => s.location)
                            .map((s) => [s.location.lat, s.location.lon]);
                        if (coords.length >= 2) {
                            const line = L.polyline(coords, {
                                color,
                                weight: 4,
                                opacity: 0.9,
                            }).addTo(map);
                            routeLines.push(line);
                            // add stop markers
                            coords.forEach((c, i) => {
                                const stop = ro.stops[i];
                                const circle = L.circleMarker(c, {
                                    radius: 3,
                                    fillColor: "#fff",
                                    color,
                                    weight: 1.5,
                                    fillOpacity: 1,
                                }).addTo(map);
                                if (stop.stop_name) {
                                    circle.bindTooltip(stop.stop_name, {
                                        className: "stop-tooltip",
                                        direction: "top",
                                        offset: [0, -6],
                                    });
                                }
                                routeLines.push(circle);
                            });
                            allCoords.push(...coords);
                        }
                    }
                });
                if (allCoords.length > 0) {
                    map.fitBounds(L.latLngBounds(allCoords).pad(0.15));
                }
            }

            function formatTime(iso) {
                if (!iso) return "";
                const m = iso.match(/T(\d{2}):(\d{2})/);
                if (!m) return iso;
                let h = parseInt(m[1]);
                const ampm = h >= 12 ? "pm" : "am";
                if (h > 12) h -= 12;
                if (h === 0) h = 12;
                return `${h}:${m[2]}${ampm}`;
            }

            // load wasm + data
            async function startup() {
                const overlay = document.getElementById("loadingOverlay");
                const loadText = document.getElementById("loadingText");
                const statusEl = document.getElementById("status");
                const statsEl = document.getElementById("stats");

                try {
                    loadText.textContent = "initializing wasm engine...";
                    await init();

                    loadText.textContent = "loading transit data...";
                    const resp = await fetch("data/sf.wheelsrouter");
                    if (!resp.ok)
                        throw new Error(`failed to load data: ${resp.status}`);
                    const buf = new Uint8Array(await resp.arrayBuffer());

                    loadText.textContent = "building routing graph...";
                    router = new WasmRouter(buf);

                    const stats = JSON.parse(router.stats());
                    statsEl.textContent = `${stats.stops} stops, ${stats.routes} routes, ${stats.trips} trips`;
                    statusEl.textContent = "ready";
                    statusEl.className = "status ready";
                    overlay.classList.add("hidden");
                } catch (e) {
                    loadText.textContent = `error: ${e.message}`;
                    statusEl.textContent = "error";
                    statusEl.className = "status error";
                    console.error(e);
                }
            }

            startup();
        </script>
    </body>
</html>
